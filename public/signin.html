<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FDFDFC">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SPLL85SBFX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SPLL85SBFX');
</script>
<title>Sign in to Mocha</title>
<meta name="description" content="Sign in to Mocha to save your scores, keep your streak and track your progress across sessions.">
<meta name="robots" content="noindex">
<style>
:root{
  --paper:#FDFDFC; --ink:#16181C; --ink-2:#61656C; --ink-3:#9DA1A8;
  --rule:rgba(22,24,28,.13); --blue:#1160D8; --yellow:#F2DE00; --ochre:#DFA13A;
  --orange:#F04E23; --peri:#9BB0D6; --stone:#F7F5F0;
  --sans:"Archivo",system-ui,sans-serif; --nar:"Archivo Narrow",system-ui,sans-serif;
  --gut:clamp(20px,5.4vw,96px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;z-index:200;background:var(--ink);color:#fff;padding:12px 18px}
.skip:focus{left:0;top:0}

.mono{font-family:var(--nar);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.h1{font-size:clamp(34px,5.4vw,68px);font-weight:500;letter-spacing:-.038em;line-height:1.02}
.h2{font-size:clamp(26px,3.6vw,46px);font-weight:500;letter-spacing:-.034em;line-height:1.04}
.h3{font-size:clamp(19px,2.2vw,26px);font-weight:500;letter-spacing:-.026em;line-height:1.12}
u.hl{text-decoration:none;box-shadow:inset 0 -.32em 0 var(--yellow)}
u.hb{text-decoration:none;box-shadow:inset 0 -.32em 0 var(--peri)}

.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px var(--gut);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.sw{width:11px;height:11px;background:var(--blue);flex:none}
.top nav{display:flex;gap:24px}
.top nav a{color:var(--ink-2);transition:color .25s}
.top nav a:hover{color:var(--ink)}
@media(max-width:760px){.top nav a:not(:last-child){display:none}}

.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 24px;font-size:15px;font-weight:500;transition:.25s}
.btn--k{background:var(--ink);color:#fff}
.btn--k:hover{background:var(--blue)}
.btn--o{border:1px solid var(--rule)}
.btn--o:hover{border-color:var(--ink)}

.sec{padding:clamp(56px,7vw,110px) var(--gut);border-top:1px solid var(--rule)}
.sec.stone{background:var(--stone)}
.sec-head{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,70px);align-items:end;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{max-width:15ch}
.sec-head p{font-size:15.5px;line-height:1.62;color:var(--ink-2);max-width:44ch}
@media(max-width:900px){.sec-head{grid-template-columns:1fr}}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.grid4 > div{padding:22px 20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grid4 b{display:block;font-size:clamp(26px,3.2vw,42px);font-weight:500;letter-spacing:-.045em;line-height:1}
.grid4 span{display:block;margin-top:10px;font-family:var(--nar);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
@media(max-width:820px){.grid4{grid-template-columns:repeat(2,1fr)}}

.ticker{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:clamp(14px,1.8vw,22px) 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tk{display:flex;width:max-content;animation:tk 44s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk a{display:flex;align-items:center;gap:12px;padding:0 clamp(18px,2.4vw,36px);white-space:nowrap;
  font-size:clamp(22px,3vw,38px);font-weight:500;letter-spacing:-.034em;color:var(--ink-3);transition:color .3s}
.tk a:hover{color:var(--ink)}
.tk i{width:8px;height:8px;flex:none}

.up{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.up.in{opacity:1;transform:none}

.foot{padding:24px var(--gut) 30px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;color:var(--ink-3)}
.foot nav{display:flex;gap:22px;flex-wrap:wrap}
.foot a:hover{color:var(--ink)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001s!important}
  html{scroll-behavior:auto}
  .up{opacity:1!important;transform:none!important}
}


.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100svh - 68px)}
.auth-l{padding:clamp(34px,5vw,80px) clamp(20px,4vw,72px);display:flex;flex-direction:column;justify-content:center}
.auth-l .mono{color:var(--blue)}
.auth-l h1{margin-top:18px;max-width:11ch}
.auth-l .lede{margin-top:18px;font-size:16px;line-height:1.6;color:var(--ink-2);max-width:38ch}
.auth-box{margin-top:32px;max-width:400px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px 18px;
  border:1px solid var(--ink);background:var(--paper);font-size:15px;font-weight:500;transition:.25s}
.gbtn:hover{background:var(--ink);color:#fff}
.gbtn:hover svg{filter:brightness(1.15)}
.gbtn svg{width:19px;height:19px;flex:none}
.or{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--ink-3)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
.mailrow{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ink)}
.mailrow input{flex:1;min-width:170px;font:inherit;font-size:16px;padding:13px 2px;border:none;background:none;color:var(--ink)}
.mailrow input:focus{outline:none}
.mailrow input::placeholder{color:var(--ink-3)}
.mailrow button{padding:13px 6px;font-family:var(--nar);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.mailrow button:hover{opacity:.55}
.msg{margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--ink-2);min-height:1.2em}
.msg.err{color:var(--orange)}
.msg.ok{color:var(--blue)}
.terms{margin-top:26px;font-size:12.5px;line-height:1.6;color:var(--ink-3);max-width:38ch}
.terms a{text-decoration:underline}
.auth-r{position:relative;border-left:1px solid var(--rule);overflow:hidden}
.auth-r img{width:100%;height:100%;object-fit:cover;object-position:58% 50%}
.auth-r figcaption{position:absolute;left:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  border-right:1px solid var(--rule);padding:10px 16px;color:var(--ink-2)}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-r{display:none}}

</style>
<link rel="stylesheet" href="/pages.css">
</head>
<body>
<main class="auth">
  <div class="auth-l">
    <a class="wordmark" href="/">mocha</a>
    <div>
      <span class="mono" id="kicker">Free · Takes 30 seconds</span>
      <h1 class="h1" id="title">Save your progress.</h1>
      <p class="lede" id="sub">Every session, score and marked answer in one place. Watch the gap close instead of guessing.</p>

      <div class="auth-box">
        <button class="gbtn" id="gbtn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.8-2 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.4z"/>
            <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.6-3.9-12.3-9.1H4.4v5.7C8 41.3 15.4 46 24 46z"/>
            <path fill="#FBBC05" d="M11.7 28.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.4A22 22 0 0 0 2 24c0 3.6.9 6.9 2.4 9.9l7.3-5.7z"/>
            <path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.4 2 8 6.7 4.4 13.8l7.3 5.7c1.7-5.2 6.6-8.8 12.3-8.8z"/>
          </svg>
          Continue with Google
        </button>

        <div class="or">OR</div>

        <label class="field-label" for="email">School or work email</label>
        <div class="mailrow">
          <input type="email" id="email" placeholder="you@university.edu" autocomplete="email">
          <button id="mailbtn" type="button">Email me a sign-in link &rarr;</button>
        </div>
        <p class="msg" id="msg"></p>
        <p class="terms">Your practice sessions are private and never shared with employers. By continuing you agree to the <a href="/legal.html">terms and privacy policy</a>.</p>
      </div>
    </div>
  </div>

  <figure class="auth-r">
    <canvas class="range" aria-hidden="true"></canvas>
    <div class="scorecard">
      <div class="row">
        <span class="kicker">Ownership · Last 5 sessions</span>
        <span class="delta">+1.4</span>
      </div>
      <div class="row">
        <div class="score">7.6 <span>/ 10</span></div>
        <span class="from">from 6.2</span>
      </div>
      <svg viewBox="0 0 300 72" width="100%" height="72" aria-hidden="true">
        <path d="M2 58 C 40 56, 70 50, 100 48 S 160 50, 190 36 S 250 18, 298 12 L 298 72 L 2 72 Z" fill="#EEF3FF"/>
        <path d="M2 58 C 40 56, 70 50, 100 48 S 160 50, 190 36 S 250 18, 298 12" fill="none" stroke="#0754FF" stroke-width="2.5"/>
        <circle cx="298" cy="12" r="4" fill="#0754FF"/>
      </svg>
      <p class="quote">“You now say what you decided, and why.”</p>
    </div>
  </figure>
</main>
<script src="/range.js"></script>

<script>

const SB_URL = 'https://xfwsnshhlfjzflobuoxd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhmd3Nuc2hobGZqemZsb2J1b3hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2ODg2NDUsImV4cCI6MjA5NDI2NDY0NX0.gZnNb3EEEy9H3ZZ-B-1lSSSbbldJkIuS0zcFmT6Wjec';
const sb = window.supabase && window.supabase.createClient
  ? window.supabase.createClient(SB_URL, SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;
function saveSession(session){
  try {
    localStorage.setItem('mocha_sb_session', JSON.stringify({
      access_token: session.access_token,
      refresh_token: session.refresh_token || '',
      user: session.user
    }));
  } catch(e){}
}

const msg = document.getElementById('msg');
const emailEl = document.getElementById('email');
const params = new URLSearchParams(location.search);
const next = params.get('next') || '/dashboard.html';

if (params.get('email')) emailEl.value = params.get('email');
if (params.get('intent') === 'pro') {
  document.getElementById('kicker').textContent = 'Pro · Takes 30 seconds';
  document.getElementById('title').textContent = 'Hold your place.';
  document.getElementById('sub').textContent = 'Sign in and we will keep your spot plus the locked in launch price. It takes about thirty seconds.';
  try { localStorage.setItem('mocha_pro_waitlist', '1'); } catch(e) {}
}
if (params.get('auth_error')) {
  msg.textContent = 'That sign in did not complete. Try again.';
  msg.className = 'msg mono err';
}

/* already signed in, or arriving back from the callback */
(async () => {
  if (!sb) { msg.textContent = 'Loading sign in...'; return; }
  const at = params.get('at'), rt = params.get('rt');
  if (at) {
    const { data, error } = await sb.auth.setSession({ access_token: at, refresh_token: rt || '' });
    if (!error && data.session) { saveSession(data.session); location.replace(next); return; }
  }
  const { data } = await sb.auth.getSession();
  if (data && data.session) { saveSession(data.session); location.replace(next); }
})();

sb && sb.auth.onAuthStateChange((event, session) => {
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
    saveSession(session);
    location.replace(next);
  }
});

document.getElementById('gbtn').addEventListener('click', () => {
  if (!sb) { msg.textContent = 'Sign in is still loading, one moment.'; return; }
  gtag && gtag('event', 'login_start', { method: 'google' });
  msg.textContent = 'Opening Google...';
  msg.className = 'msg mono ok';
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: 'https://usemocha.app/api/callback' }
  });
});

document.getElementById('mailbtn').addEventListener('click', async () => {
  const v = emailEl.value.trim();
  if (!/^\S+@\S+\.\S+$/.test(v)) {
    msg.textContent = 'Enter a valid email address'; msg.className = 'msg mono err'; return;
  }
  if (!sb) { msg.textContent = 'Sign in is still loading, one moment.'; return; }
  msg.textContent = 'Sending your link...'; msg.className = 'msg mono';
  const { error } = await sb.auth.signInWithOtp({
    email: v,
    options: { emailRedirectTo: 'https://usemocha.app/dashboard.html' }
  });
  if (error) {
    msg.textContent = error.message || 'Could not send that link. Try Google instead.';
    msg.className = 'msg mono err';
  } else {
    gtag && gtag('event', 'login_start', { method: 'magic_link' });
    msg.textContent = 'Check ' + v + ' for your sign in link.';
    msg.className = 'msg mono ok';
  }
});
emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('mailbtn').click(); });
</script>
</body>
</html>
